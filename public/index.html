<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Management Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-6 md:p-12">
  <div class="max-w-6xl mx-auto space-y-8">
    
    <!-- Header -->
    <div class="flex flex-col md:flex-row md:items-center md:justify-between border-b border-slate-800 pb-6 gap-4">
      <div>
        <h1 class="text-3xl font-bold bg-gradient-to-r from-cyan-400 to-blue-500 bg-clip-text text-transparent">User Control Center</h1>
        <p class="text-slate-400 text-sm mt-1">Fullstack Node.js + Express + MongoDB CRUD App</p>
      </div>
      <div id="connectionBadge" class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-emerald-500/10 text-emerald-400 text-xs font-medium border border-emerald-500/20 w-fit">
        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> DB Connected
      </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
      
      <!-- Form Section -->
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl h-fit">
        <h2 id="formTitle" class="text-xl font-semibold mb-4 text-slate-200">Create New User</h2>
        <form id="userForm" class="space-y-4">
          <input type="hidden" id="userId">
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">Full Name</label>
            <input type="text" id="name" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-cyan-500 transition">
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">Email Address</label>
            <input type="email" id="email" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-cyan-500 transition">
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">Age</label>
            <input type="number" id="age" min="0" max="120" value="25" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-cyan-500 transition">
          </div>
          <div class="pt-2 flex gap-3">
            <button type="submit" id="submitBtn" class="flex-1 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white font-medium py-2.5 rounded-xl text-sm transition shadow-lg shadow-cyan-500/20">Save User</button>
            <button type="button" id="cancelBtn" onclick="resetForm()" class="hidden px-4 bg-slate-800 hover:bg-slate-700 text-slate-300 font-medium py-2.5 rounded-xl text-sm transition">Cancel</button>
          </div>
        </form>
      </div>

      <!-- Data Table Section -->
      <div class="lg:col-span-2 bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl">
        <div class="flex items-center justify-between mb-4">
          <h2 class="text-xl font-semibold text-slate-200">Registered Users</h2>
          <button onclick="fetchUsers()" class="text-xs text-cyan-400 hover:text-cyan-300 transition">Refresh Data</button>
        </div>
        
        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse">
            <thead>
              <tr class="border-b border-slate-800 text-slate-400 text-xs font-medium uppercase tracking-wider">
                <th class="py-3 px-4">Name</th>
                <th class="py-3 px-4">Email</th>
                <th class="py-3 px-4">Age</th>
                <th class="py-3 px-4 text-right">Actions</th>
              </tr>
            </thead>
            <tbody id="userTableBody" class="divide-y divide-slate-800/60 text-sm">
              <!-- Dynamic Rows -->
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </div>

  <script>
    const API_URL = '/api/users';

    document.addEventListener('DOMContentLoaded', fetchUsers);

    async function fetchUsers() {
      try {
        const res = await fetch(API_URL);
        const result = await res.json();
        const tbody = document.getElementById('userTableBody');
        tbody.innerHTML = '';

        if (result.data.length === 0) {
          tbody.innerHTML = `<tr><td colspan="4" class="text-center py-6 text-slate-500">No users found</td></tr>`;
          return;
        }

        result.data.forEach(user => {
          tbody.innerHTML += `
            <tr class="hover:bg-slate-800/30 transition">
              <td class="py-3.5 px-4 font-medium text-slate-200">${user.name}</td>
              <td class="py-3.5 px-4 text-slate-400">${user.email}</td>
              <td class="py-3.5 px-4 text-slate-400">${user.age}</td>
              <td class="py-3.5 px-4 text-right space-x-2">
                <button onclick="editUser('${user._id}', '${user.name}', '${user.email}', ${user.age})" class="text-xs px-2.5 py-1 rounded-lg bg-cyan-500/10 text-cyan-400 hover:bg-cyan-500/20 border border-cyan-500/20 transition">Edit</button>
                <button onclick="deleteUser('${user._id}')" class="text-xs px-2.5 py-1 rounded-lg bg-rose-500/10 text-rose-400 hover:bg-rose-500/20 border border-rose-500/20 transition">Delete</button>
              </td>
            </tr>
          `;
        });
      } catch (err) {
        console.error('Fetch error:', err);
      }
    }

    document.getElementById('userForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = document.getElementById('userId').value;
      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const age = document.getElementById('age').value;

      const payload = { name, email, age: Number(age) };
      const method = id ? 'PUT' : 'POST';
      const url = id ? `${API_URL}/${id}` : API_URL;

      try {
        const res = await fetch(url, {
          method,
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();

        if (res.ok) {
          resetForm();
          fetchUsers();
        } else {
          alert(data.error || 'Operation failed');
        }
      } catch (err) {
        console.error('Submit error:', err);
      }
    });

    function editUser(id, name, email, age) {
      document.getElementById('userId').value = id;
      document.getElementById('name').value = name;
      document.getElementById('email').value = email;
      document.getElementById('age').value = age;
      
      document.getElementById('formTitle').innerText = 'Edit User';
      document.getElementById('submitBtn').innerText = 'Update User';
      document.getElementById('cancelBtn').classList.remove('hidden');
    }

    function resetForm() {
      document.getElementById('userId').value = '';
      document.getElementById('userForm').reset();
      document.getElementById('formTitle').innerText = 'Create New User';
      document.getElementById('submitBtn').innerText = 'Save User';
      document.getElementById('cancelBtn').classList.add('hidden');
    }

    async function deleteUser(id) {
      if (!confirm('Are you sure you want to delete this user?')) return;
      try {
        const res = await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
        if (res.ok) fetchUsers();
      } catch (err) {
        console.error('Delete error:', err);
      }
    }
  </script>
</body>
</html>
